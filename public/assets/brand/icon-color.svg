<?xml version="1.0" encoding="UTF-8"?>
<!-- Refined production reconstruction of the supplied AC mark.
     Smooth cubic curves replace the pixel-edge trace. The node ring is transparent.
     Keep this viewBox and scale uniformly; no fonts or raster images are required. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" role="img" aria-labelledby="title desc">
  <title id="title">Dr. Alan Chmiel AC icon</title>
  <desc id="desc">Charcoal serif A, deep red open C, and a horizontal decision line with a red node.</desc>
  <defs>
    <!-- Knockout preserves the node’s clear ring on any background. -->
    <mask id="node-ring" maskUnits="userSpaceOnUse" x="0" y="0" width="460" height="330">
      <rect width="460" height="330" fill="white"/>
      <circle cx="257" cy="180" r="19" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#node-ring)">
    <!-- Open C: separately drawn upper and lower tapered strokes. -->
    <path fill="#92191A" d="M170 135 C182 77 202 44 247 31 C320 8 394 45 429 112 C385 57 321 29 267 44 C215 56 189 89 170 135 Z"/>
    <path fill="#92191A" d="M190 255 C232 306 285 317 331 304 C376 292 405 269 429 239 C401 300 356 322 306 321 C250 322 211 295 190 255 Z"/>
    <!-- Serif A: straight structural edges and curved lower serif transitions. -->
    <path fill="#1F2226" d="M6 318 C42 314 54 297 70 266 L195 5 L314 320 C292 321 274 320 258 316 L172 69 L86 276 C71 307 72 315 112 318 Z"/>
    <!-- Tapered horizontal axis, with a restrained gray continuation. -->
    <path fill="#B8B8B8" d="M20 180 L257 177 L455 180 L257 183 Z"/>
    <path fill="#1F2226" d="M20 180 L257 177 L257 183 Z"/>
    <path fill="#92191A" d="M170 179 L257 177 L257 183 L170 181 Z"/>
  </g>
  <circle cx="257" cy="180" r="14" fill="#92191A"/>
</svg>
